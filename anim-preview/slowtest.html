<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<meta name="robots" content="noindex, nofollow" />
	<title>Preview · slowtest animation</title>
	<style>
		:root{
			--blue:#073e77; --yellow:#fece00; --cream:#f6f1e6; --ink:#0b1220; --soft:#233;
			--water:#cfe8f3; --land:#efe4c8; --algae:#6aa832; --bluegreen:#2a9d8f; --mud:#8d6e4f;
			--go:#2e9e44; --watch:#e0a800; --stop:#d7263d;
		}
		html, body{ margin:0; }
		body{ font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:var(--cream); color:var(--ink); overflow-x:hidden; }
		/* Same slide rules as bioglow-judging.html */
		.slide{ box-sizing:border-box; min-height:100vh; min-height:100dvh; padding:clamp(14px,3vw,40px) clamp(16px,4vw,64px) 84px; display:flex; flex-direction:column; }
		.slide > .inner{ margin:auto 0; width:100%; max-width:1280px; align-self:center; text-align:center; }
		.kicker{ display:inline-block; font-size:clamp(13px,1.4vw,18px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--blue); background:#fff; border:1px solid rgba(7,62,119,.18); border-radius:999px; padding:4px 12px; margin:0 0 10px; }
		h2{ margin:0 0 8px; line-height:1.1; }
		h2.t{ font-size:clamp(28px,4.6vw,64px); }
		p.line{ font-size:clamp(19px,2.6vw,36px); line-height:1.3; margin:0 auto 18px; max-width:30ch; color:var(--soft); }
		p.line.wide{ max-width:40ch; }
		.visual{ margin:0 auto; width:100%; }
		.visual svg{ display:block; width:100%; height:auto; max-height:52vh; max-height:52dvh; margin:0 auto; }
		@media (max-height:820px) and (min-width:861px){
			.slide{ padding-top:12px; padding-bottom:66px; }
			.kicker{ margin-bottom:6px; padding:3px 10px; }
			h2.t{ font-size:clamp(26px,3.8vw,50px); margin-bottom:4px; }
			p.line{ font-size:clamp(18px,2.1vw,28px); margin-bottom:10px; }
			.visual svg{ max-height:46vh; max-height:46dvh; }
		}
		.test{ position:fixed; left:8px; bottom:8px; font-size:12px; color:var(--soft); }
		.test a{ color:var(--blue); }
	</style>
</head>
<body>
	<section class="slide active">
		<div class="inner">
			<p class="kicker">3 · Video call · Oct 14</p>
			<h2 class="t">A bloom scientist at NY State DEC</h2>
			<p class="line wide">Boat and lab tests are slow and cost a lot.</p>
			<div class="visual" data-anim="slowtest"></div>
			<p class="line wide" style="margin-top:14px;">Small lakes bloom too. So we switched from the bay to a lake.</p>
		</div>
	</section>
	<p class="test">Preview only · <a href="#" id="leave">simulate leaving the slide</a> · <span id="deckkey"></span></p>

	<script src="../js/anim/slowtest.js"></script>
	<script>
		/* Test helpers: the real deck advances on Enter/Space; here we just count them. */
		var n = 0, out = document.getElementById("deckkey");
		document.addEventListener("keydown", function (e) {
			if (e.key === "Enter" || e.key === " ") { n++; out.textContent = "deck would advance: " + n; }
		});
		document.getElementById("leave").addEventListener("click", function (e) {
			e.preventDefault();
			var s = document.querySelector(".slide");
			s.classList.remove("active");
			setTimeout(function () { s.classList.add("active"); }, 300);
		});
	</script>
</body>
</html>
